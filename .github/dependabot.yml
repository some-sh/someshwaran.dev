# Dependency updates, so upgrades stop being a manual project.
#
# Minor and patch updates are grouped per ecosystem into one weekly PR (less
# noise); major versions arrive as their own PRs so each gets a proper look.
# GitHub Actions are pinned to commit SHAs in ci.yml, which this keeps current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { update-types: [minor, patch] }

  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      backend: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend: { update-types: [minor, patch] }
    ignore:
      # @types/node must match the Node major used in CI and the Dockerfile
      # (currently 26). Bump all three by hand together instead of following
      # whichever major is newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    groups:
      e2e: { update-types: [minor, patch] }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Odd-numbered Node releases are short-lived "Current" lines that never
      # become LTS (25 was skipped for the same reason); stay on even majors.
      # Revisit when Node 28 ships.
      - dependency-name: node
        versions: ["27.x"]
