# Dependency updates, so upgrades stop being a manual project.
#
# Minor and patch updates are grouped per ecosystem into one weekly PR (less
# noise); major versions arrive as their own PRs so each gets a proper look.
# GitHub Actions are pinned to commit SHAs in ci.yml, which this keeps current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { update-types: [minor, patch] }

  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      backend: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    groups:
      e2e: { update-types: [minor, patch] }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
