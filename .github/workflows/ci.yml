name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: no job here writes to the repository or its issues/PRs. The
# deploy job authenticates to FastAPI Cloud with its own secrets, not this token.
permissions:
  contents: read

# A newer push to the same PR supersedes the older run. Pushes to main are
# never cancelled mid-run (a half-finished deploy is worse than a slow one); a
# newer push just replaces a run that has not started yet.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint, typecheck, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Production runs on Postgres; this service runs the Postgres-only
    # integration tests (tests/integration/test_postgres.py) alongside the
    # SQLite ones. The database name contains "test" on purpose: those tests
    # wipe the public schema and refuse any other name.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.15

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Typecheck (mypy)
        run: uv run mypy app

      - name: Migrations apply cleanly, match models
        run: |
          uv run alembic upgrade head
          uv run alembic check
        env:
          APP_DATABASE_URL: sqlite:///./ci-check.db

      - name: Migrations apply cleanly, match models (Postgres)
        run: |
          uv run alembic upgrade head
          uv run alembic check
        env:
          APP_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test

      - name: Unit + integration tests (pytest, incl. Postgres)
        run: uv run pytest
        env:
          APP_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/app_test

  backend-min-python:
    name: Backend tests on the minimum Python (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Production runs on Postgres; this service runs the Postgres-only
    # integration tests (tests/integration/test_postgres.py) alongside the
    # SQLite ones. The database name contains "test" on purpose: those tests
    # wipe the public schema and refuse any other name.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # `.python-version` pins the latest; this job overrides it with the oldest
    # Python the project still supports (requires-python), so a 3.12+ only
    # feature can't slip in unnoticed.
    env:
      UV_PYTHON: "3.11"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Tests (pytest, incl. Postgres) on 3.11
        run: uv run pytest
        env:
          APP_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/app_test

  frontend:
    name: Frontend (lint, typecheck, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test

  # Playwright drives the real app end-to-end (real backend, real built
  # frontend, real SQLite file), so per CLAUDE.md's testing bar this runs
  # only on merge to main, not on every PR push.
  e2e:
    name: E2E (Playwright)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.15

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --dev

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Format check (prettier)
        working-directory: e2e
        run: npm run format:check

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # Gated on every other job per CLAUDE.md ("deploy workflow gated on all
  # checks") — needs: implies this only runs once backend, frontend, and
  # e2e have all *succeeded* (a skipped or failed dependency skips this
  # job too, by default). On a pull_request push, e2e is skipped (see
  # above), so this job is too — the `if:` below is what actually keeps
  # it off pull requests; the needs-chain is what keeps it off a red or
  # skipped push.
  deploy:
    name: Deploy to FastAPI Cloud
    needs: [backend, backend-min-python, frontend, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One production deploy at a time, across all workflow runs. Queued, not
    # cancelled: cutting a deploy off partway is the risky outcome.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
          enable-cache: true

      # Matches the backend/e2e jobs above: without this, `uv run` in
      # scripts/deploy.sh would fall back to whatever Python (if any)
      # ubuntu-latest happens to ship, rather than the uv-managed 3.15 the
      # project targets — a mismatch that broke the actual FastAPI Cloud
      # deploy (its remote build failed installing a Python interpreter).
      - name: Set up Python
        run: uv python install 3.15

      # Builds the frontend, copies it into backend/frontend_dist/, and
      # runs `fastapi deploy` — the exact same script a local manual
      # deploy uses (see README's Deploying section), so there's one
      # deploy procedure, not a CI-only copy of it that can drift.
      - name: Deploy
        run: ./scripts/deploy.sh
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
