name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, typecheck, unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Typecheck (mypy)
        run: uv run mypy app

      - name: Migrations apply cleanly, match models
        run: |
          uv run alembic upgrade head
          uv run alembic check
        env:
          APP_DATABASE_URL: sqlite:///./ci-check.db

      - name: Unit tests (pytest)
        run: uv run pytest

  frontend:
    name: Frontend (lint, typecheck, unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test

  # Playwright drives the real app end-to-end (real backend, real built
  # frontend, real SQLite file), so per CLAUDE.md's testing bar this runs
  # only on merge to main, not on every PR push.
  e2e:
    name: E2E (Playwright)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Format check (prettier)
        working-directory: e2e
        run: npm run format:check

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # Gated on every other job per CLAUDE.md ("deploy workflow gated on all
  # checks") — needs: implies this only runs once backend, frontend, and
  # e2e have all *succeeded* (a skipped or failed dependency skips this
  # job too, by default). On a pull_request push, e2e is skipped (see
  # above), so this job is too — the `if:` below is what actually keeps
  # it off pull requests; the needs-chain is what keeps it off a red or
  # skipped push.
  deploy:
    name: Deploy to FastAPI Cloud
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      # Builds the frontend, copies it into backend/frontend_dist/, and
      # runs `fastapi deploy` — the exact same script a local manual
      # deploy uses (see README's Deploying section), so there's one
      # deploy procedure, not a CI-only copy of it that can drift.
      - name: Deploy
        run: ./scripts/deploy.sh
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
