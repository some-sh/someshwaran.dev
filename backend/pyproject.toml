[project]
name = "someshwaran-backend"
version = "0.1.0"
description = "someshwaran.dev backend: FastAPI app + resume manager API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    # [standard] extra pulls in uvicorn + the fastapi-cli, needed for both
    # `fastapi dev` locally and `fastapi deploy` to FastAPI Cloud (see CLAUDE.md).
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.42",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
