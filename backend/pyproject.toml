[project]
name = "someshwaran-backend"
version = "0.1.0"
description = "someshwaran.dev backend: FastAPI app + resume manager API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    # [standard] extra pulls in uvicorn + the fastapi-cli, needed for both
    # `fastapi dev` locally and `fastapi deploy` to FastAPI Cloud (see CLAUDE.md).
    "fastapi[standard]>=0.162.5",
    # >=2.0 since the SDK's 2.x line renamed FastMCP -> MCPServer and is what
    # app/mcp_server.py is written against; see that module.
    "mcp>=2.3.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.2",
    "python-docx>=1.2.0",
    "reportlab>=5.1.0",
    "sqlmodel>=0.0.49",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "httpx>=0.27",
    "pypdf>=7.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

# Neither ships type stubs or a py.typed marker.
[[tool.mypy.overrides]]
module = ["reportlab.*", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
